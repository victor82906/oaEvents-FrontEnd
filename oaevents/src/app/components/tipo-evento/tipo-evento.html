<div class="admin-layout-container">
  <app-cabecera></app-cabecera>

  <div class="admin-main-content">

    <main class="page-content">
      <div class="container-fluid">
        <h1 class="mb-4 fw-bold text-primary-custom">Gestión de Tipos de Evento</h1>

        <!-- Spinner de Carga -->
        @if (cargando) {
          <div class="spinner-container">
            <div class="spinner"></div>
          </div>
        }

        <!-- Contenido -->
        @if (!cargando && tiposEvento) {
          @if (tiposEvento.length === 0) {
            <div class="alert alert-info text-center">
              No se encontraron tipos de evento.
            </div>
          } @else {
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre</th>
                    <th scope="col" class="text-end">Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  @for (tipo of tiposEvento; track tipo.id) {
                    <tr>
                      <td>{{ tipo.id }}</td>
                      <td>{{ tipo.nombre }}</td>
                      <td class="text-end">
                        <button class="btn btn-sm btn-outline-danger" title="Eliminar" (click)="confirmarEliminacion(tipo.id)">
                          <i class="bi bi-trash"></i>
                        </button>
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
            </div>
          }

          <!-- Contenedor para Botón Registrar -->
          <div class="d-flex justify-content-between align-items-center mt-3">
            <button class="btn btn-primary-custom" routerLink="/crear-tipo-evento">
              <i class="bi bi-plus-circle me-2"></i>
              Registrar Tipo de Evento
            </button>
          </div>
        }
      </div>
    </main>
  </div>

  <app-footer></app-footer>
</div>

<app-modal-confirmar #modalConfirmar (confirmar)="eliminarTipoEvento($event)"></app-modal-confirmar>
<app-modal-error #modalError></app-modal-error>
<app-modal-exito #modalExito></app-modal-exito>
