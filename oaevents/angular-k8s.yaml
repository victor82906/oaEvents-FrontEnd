# 1. El Deployment del Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oaevents-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oaevents-frontend
  template:
    metadata:
      labels:
        app: oaevents-frontend
    spec:
      containers:
      - name: frontend
        image: oaevents-frontend:v1
        # La imagen es local, que no la busque en internet
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
# 2. El Service del Frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: oaevents-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# 3. El Ingress específico del Frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: www.olivoarenaentradas.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

